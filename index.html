    <script>
      // Ensure trailing slash for GitHub Pages project path to guarantee relative asset loading
      if (location.pathname.endsWith('/Video-Edit-Portfolio')) {
        location.replace(location.pathname + '/' + location.search + location.hash);
      }

    <style>
